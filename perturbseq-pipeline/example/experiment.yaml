# Purpose: User-supplied experiment definition for metadata-driven contrasts.

metadata:
  treatment_column: treatment
  perturbation_column: perturbation
  replicate_column: replicate
  optional_covariates: []

references:
  treatment: Control
  perturbation: NonTargeting

contrasts:
  auto_generate:
    treatment_vs_reference: true
    perturbation_vs_reference: true
    interaction: true
  explicit: []
